<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kigali Night Racer</title>
<style>
:root{--night:#12102b;--road:#23203f;--sun:#ff8a3d;--pink:#ff3d7f;--teal:#2de2c4;--cream:#fff3df}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--cream);font-family:"Trebuchet MS",Verdana,sans-serif;overscroll-behavior:none;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:min(100vh,860px);aspect-ratio:400/700;max-width:100vw}
canvas{display:block;width:100%;height:100%;border-radius:14px;box-shadow:0 0 50px #ff3d7f44}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#12102bdd;border-radius:14px}
h1{margin:0;font-size:clamp(30px,8vw,44px);line-height:1;letter-spacing:.02em;color:var(--sun);text-shadow:0 0 18px #ff8a3d88}
#msg{margin:0;font-size:18px;line-height:1.4;max-width:30ch}
button{font:inherit;font-weight:700;font-size:20px;padding:12px 32px;border:0;border-radius:999px;background:var(--teal);color:var(--night);cursor:pointer}
button:hover{background:var(--cream)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
small{opacity:.75;max-width:32ch;line-height:1.4}
#nitro{position:absolute;right:12px;bottom:12px;width:76px;height:76px;padding:0;font-size:15px;display:none;background:var(--pink);color:var(--cream);box-shadow:0 0 18px #ff3d7f99;user-select:none;touch-action:none}
#nitro.on{background:var(--sun);color:var(--night)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="700" aria-label="Racing game"></canvas>
  <button id="nitro" type="button">Nitro</button>
  <div id="ui">
    <h1>Kigali Night Racer</h1>
    <p id="msg">Dodge cars, motorbikes and buses, grab coins, and race through the city at night.</p>
    <button id="btn">Start driving</button>
    <small>Steer with the left and right arrow keys or A and D. Hold Space for nitro. On a phone, hold the left or right side of the screen and hold the Nitro button.</small>
  </div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ui = document.getElementById('ui'), msg = document.getElementById('msg'), btn = document.getElementById('btn'), nb = document.getElementById('nitro');
const W = 400, H = 700, L = 40, R = 360, LANE = 80, LEVEL_LEN = 8000;
const COLORS = ['#ff3d7f', '#2de2c4', '#ffd23d', '#8f7bff', '#ff8a3d'];
const SKY = ['#2a1a4a', '#40164f', '#12344d', '#4b1830', '#1d2a52'];
let best = 0;
try { best = +localStorage.getItem('kigaliRacerBest') || 0; } catch (e) {}

let state = 'menu', s, boost, nitro, dist, level, banner, player, cars, coins, spawnT, coinT, roadY, got, shake, lastLane, tick = 0;
const keys = { l: false, r: false, n: false };

function reset() {
  s = 6; boost = 0; nitro = 30; dist = 0; level = 1; banner = 0; got = 0; shake = 0; roadY = 0;
  spawnT = 120; coinT = 300; lastLane = -1;
  player = { x: W / 2, vx: 0, y: H - 120, w: 42, h: 68 };
  cars = []; coins = [];
}
reset();

let ac;
function beep(f, d, type, v) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.value = f; g.gain.value = v || 0.05;
    o.connect(g); g.connect(ac.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.stop(ac.currentTime + d);
  } catch (e) {}
}

function start() {
  reset(); state = 'play'; ui.style.display = 'none'; nb.style.display = 'block';
  beep(440, 0.12); setTimeout(() => beep(660, 0.15), 120);
}
function crash() {
  state = 'over'; shake = 16; keys.n = false; nb.style.display = 'none'; nb.classList.remove('on');
  beep(110, 0.5, 'sawtooth', 0.12);
  const score = getScore(), isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('kigaliRacerBest', best); } catch (e) {} }
  msg.textContent = 'Crashed on level ' + level + '! Score ' + score + (isBest ? ' (new best!)' : '. Best ' + best + '.');
  btn.textContent = 'Drive again';
  setTimeout(() => { ui.style.display = 'flex'; btn.focus(); }, 700);
}
const getScore = () => Math.floor(dist / 10) + got * 25;
const pick = () => COLORS[Math.random() * COLORS.length | 0];

function spawnVehicle(lane) {
  const r = Math.random();
  let v = { x: L + LANE * lane + LANE / 2, y: -140, t: 'car', w: 48, h: 68, v: 2 + Math.random() * 2.5, c: pick() };
  if (dist > 1500 && r < 0.2) v = { x: v.x, y: -100, t: 'moto', w: 24, h: 54, v: 3 + Math.random() * 2, c: pick() };
  else if (level >= 2 && r >= 0.2 && r < 0.35) v = { x: v.x, y: -160, t: 'bus', w: 56, h: 128, v: 0.5 + Math.random() * 1.5, c: '#4aa8ff' };
  cars.push(v);
}
const otherLane = n => { let l; do { l = Math.random() * 4 | 0; } while (l === n); return l; };

function update(dt) {
  tick += dt;
  const a = 1.1 * dt;
  if (keys.l) player.vx -= a;
  if (keys.r) player.vx += a;
  player.vx = Math.max(-7, Math.min(7, player.vx * Math.pow(0.85, dt)));
  player.x += player.vx * dt;
  const lo = L + player.w / 2 + 4, hi = R - player.w / 2 - 4;
  if (player.x < lo) { player.x = lo; player.vx = 0; }
  if (player.x > hi) { player.x = hi; player.vx = 0; }

  // nitro
  const on = keys.n && nitro > 0;
  if (on) nitro = Math.max(0, nitro - 1.1 * dt);
  nitro = Math.min(100, nitro + 0.02 * dt);
  boost += ((on ? 1 : 0) - boost) * Math.min(1, 0.15 * dt);

  // levels
  const lv = 1 + Math.floor(dist / LEVEL_LEN);
  if (lv > level) {
    level = lv; banner = 150; nitro = Math.min(100, nitro + 25);
    s = Math.max(s, Math.min(14, 5.5 + level * 1.3));
    beep(523, 0.1); setTimeout(() => beep(784, 0.2), 110);
  }
  if (banner > 0) banner -= dt;

  s = Math.min(Math.min(20, 12 + level * 1.5), s + 0.0015 * dt);
  const se = s + boost * 5;
  dist += se * dt * (1 + 0.5 * boost); roadY = (roadY + se * dt) % 80;

  spawnT -= se * dt;
  if (spawnT <= 0) {
    const lane = otherLane(lastLane); lastLane = lane; spawnVehicle(lane);
    if (s > 8 && Math.random() < Math.min(0.55, 0.05 + 0.08 * level)) spawnVehicle(otherLane(lane));
    spawnT = Math.max(100, 270 - se * 8 - level * 8) + Math.random() * 90;
  }
  coinT -= se * dt;
  if (coinT <= 0) {
    const x = L + LANE * (Math.random() * 4 | 0) + LANE / 2;
    for (let i = 0; i < 3; i++) coins.push({ x, y: -20 - i * 45 });
    coinT = 420 + Math.random() * 300;
  }

  for (const c of cars) c.y += (se - c.v) * dt;
  for (const k of coins) k.y += se * dt;
  cars = cars.filter(c => c.y < H + 160);
  coins = coins.filter(k => k.y < H + 30);

  for (const c of cars) {
    if (Math.abs(c.x - player.x) < (c.w + player.w) / 2 - 4 && Math.abs(c.y - player.y) < (c.h + player.h) / 2 - 6) { crash(); return; }
  }
  coins = coins.filter(k => {
    if (Math.hypot(k.x - player.x, k.y - player.y) < 30) {
      got++; nitro = Math.min(100, nitro + 12); beep(880 + got % 5 * 60, 0.08, 'triangle', 0.06); return false;
    }
    return true;
  });
}

function lights(w, h) {
  ctx.fillStyle = '#fff3b0'; ctx.fillRect(-w / 2 + 3, -h / 2 + 2, 8, 5); ctx.fillRect(w / 2 - 11, -h / 2 + 2, 8, 5);
  ctx.fillStyle = '#ff2b2b'; ctx.fillRect(-w / 2 + 3, h / 2 - 6, 8, 4); ctx.fillRect(w / 2 - 11, h / 2 - 6, 8, 4);
}
function car(x, y, w, h, color, tilt) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt || 0);
  ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 10); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#12102bcc';
  ctx.beginPath(); ctx.roundRect(-w / 2 + 5, -h / 2 + 16, w - 10, 18, 5); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-w / 2 + 6, h / 2 - 24, w - 12, 12, 4); ctx.fill();
  lights(w, h); ctx.restore();
}
function moto(x, y, w, h, color) {
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = color; ctx.shadowBlur = 10; ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-w / 2 + 5, -h / 2, w - 10, h, 6); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#12102b'; ctx.fillRect(-w / 2, -h / 2 + 10, w, 4);
  ctx.fillStyle = '#fff3df'; ctx.beginPath(); ctx.arc(0, -2, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3b0'; ctx.fillRect(-3, -h / 2, 6, 4);
  ctx.fillStyle = '#ff2b2b'; ctx.fillRect(-3, h / 2 - 3, 6, 3);
  ctx.restore();
}
function bus(x, y, w, h, color) {
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 8); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#12102bcc';
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.roundRect(-w / 2 + 7, -h / 2 + 14 + i * 21, w - 14, 14, 3); ctx.fill(); }
  ctx.fillStyle = '#fff3df'; ctx.fillRect(-w / 2, -h / 2 + 8, w, 3);
  lights(w, h); ctx.restore();
}

function skyline() {
  const g = ctx.createLinearGradient(0, 0, 0, 180);
  g.addColorStop(0, SKY[(level - 1) % SKY.length]); g.addColorStop(1, '#12102b00');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 180);
  // rolling hills
  ctx.fillStyle = '#1a1440'; ctx.beginPath(); ctx.moveTo(0, 120);
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, 92 - 14 * Math.sin(x / 38) - 8 * Math.sin(x / 15));
  ctx.lineTo(W, 120); ctx.fill();
  // buildings: x, width, height
  const B = [[0, 24, 34], [24, 18, 58], [42, 28, 40], [70, 20, 76], [90, 26, 44], [116, 22, 30], [244, 22, 46], [266, 18, 70], [284, 28, 38], [312, 20, 84], [332, 24, 50], [356, 44, 36]];
  ctx.fillStyle = '#0a0820';
  for (const [x, w, h] of B) ctx.fillRect(x, 108 - h, w, h);
  // Kigali Convention Centre dome with a ring of lights
  ctx.beginPath(); ctx.ellipse(180, 108, 46, 36, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#ff8a3d';
  for (let i = 0; i < 9; i++) { const an = Math.PI + (i + 0.5) * Math.PI / 9; ctx.fillRect(180 + Math.cos(an) * 40 - 1, 108 + Math.sin(an) * 30 - 1, 3, 3); }
  // lit windows
  ctx.fillStyle = '#ffd23dcc';
  for (const [x, w, h] of B) for (let j = 0; j < h / 8 - 1; j++) for (let i = 0; i < w / 7 - 0.5; i++) {
    if ((x * 7 + i * 13 + j * 5) % 5 < 2) ctx.fillRect(x + 4 + i * 7, 108 - h + 5 + j * 8, 2, 3);
  }
}

function draw() {
  ctx.save();
  if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.9; }
  ctx.fillStyle = '#12102b'; ctx.fillRect(-20, -20, W + 40, H + 40);
  for (let y = -120 + (roadY * 1.5) % 120; y < H; y += 120) {
    ctx.fillStyle = '#ff8a3d'; ctx.fillRect(14, y, 6, 22);
    ctx.fillStyle = '#2de2c4'; ctx.fillRect(W - 20, y + 60, 6, 22);
  }
  ctx.fillStyle = '#23203f'; ctx.fillRect(L, 0, R - L, H);
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#ff3d7f'; ctx.fillStyle = '#ff3d7f'; ctx.fillRect(L - 4, 0, 4, H);
  ctx.shadowColor = '#2de2c4'; ctx.fillStyle = '#2de2c4'; ctx.fillRect(R, 0, 4, H);
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff3df55';
  for (let k = 1; k < 4; k++) for (let y = -80 + roadY; y < H; y += 80) ctx.fillRect(L + LANE * k - 2, y, 4, 40);
  if (boost > 0.1) {
    ctx.fillStyle = '#fff3df44';
    for (let i = 0; i < 10 * boost; i++) ctx.fillRect(L + Math.random() * (R - L), Math.random() * H, 2, 40);
  }

  for (const k of coins) {
    ctx.fillStyle = '#ffd23d'; ctx.shadowColor = '#ffd23d'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(k.x, k.y, 10, 0, 7); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#b8860b'; ctx.fillRect(k.x - 2, k.y - 5, 4, 10);
  }
  for (const c of cars) (c.t === 'moto' ? moto : c.t === 'bus' ? bus : car)(c.x, c.y, c.w, c.h, c.c, 0);

  skyline();

  if (boost > 0.05) {
    const f = (16 + Math.random() * 14) * boost;
    ctx.save(); ctx.translate(player.x, player.y + player.h / 2);
    ctx.fillStyle = '#ff8a3d'; ctx.shadowColor = '#ff3d7f'; ctx.shadowBlur = 16;
    for (const dx of [-10, 10]) { ctx.beginPath(); ctx.moveTo(dx - 5, 0); ctx.lineTo(dx + 5, 0); ctx.lineTo(dx, f * 1.6); ctx.fill(); }
    ctx.restore();
  }
  car(player.x, player.y, player.w, player.h, '#fff3df', player.vx * 0.02);
  ctx.restore();

  if (state !== 'menu') {
    ctx.shadowColor = '#000'; ctx.shadowBlur = 5;
    ctx.fillStyle = '#fff3df'; ctx.font = 'bold 22px "Trebuchet MS", sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('Score ' + getScore(), 54, 34);
    ctx.fillStyle = '#ffd23d'; ctx.fillText('Coins ' + got, 54, 62);
    ctx.textAlign = 'right'; ctx.fillStyle = '#2de2c4'; ctx.fillText(Math.round((s + boost * 5) * 12) + ' km/h', 346, 34);
    ctx.fillStyle = '#fff3dfaa'; ctx.font = '16px "Trebuchet MS", sans-serif'; ctx.fillText('Best ' + best, 346, 58);
    ctx.fillStyle = '#ff8a3d'; ctx.font = 'bold 18px "Trebuchet MS", sans-serif'; ctx.fillText('Level ' + level, 346, 82);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#12102b99'; ctx.fillRect(54, 72, 112, 12);
    ctx.fillStyle = boost > 0.1 ? '#ff8a3d' : '#ff3d7f'; ctx.fillRect(55, 73, 110 * nitro / 100, 10);
    if (banner > 0) {
      ctx.globalAlpha = Math.min(1, banner / 40); ctx.textAlign = 'center';
      ctx.fillStyle = '#ff8a3d'; ctx.font = 'bold 44px "Trebuchet MS", sans-serif'; ctx.fillText('Level ' + level, W / 2, 300);
      ctx.fillStyle = '#fff3df'; ctx.font = '18px "Trebuchet MS", sans-serif'; ctx.fillText('Faster and busier. Nitro refilled.', W / 2, 330);
      ctx.globalAlpha = 1;
    }
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(2.5, (now - last) / 16.67); last = now;
  if (state === 'play') update(dt);
  else if (state === 'menu') roadY = (roadY + 3 * dt) % 80;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

btn.addEventListener('click', start);
const isL = k => k === 'ArrowLeft' || k === 'a' || k === 'A';
const isR = k => k === 'ArrowRight' || k === 'd' || k === 'D';
const isN = k => k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Shift';
addEventListener('keydown', e => {
  if (isL(e.key)) keys.l = true;
  if (isR(e.key)) keys.r = true;
  if ((e.key === 'Enter' || e.key === ' ') && ui.style.display !== 'none' && state !== 'play') { e.preventDefault(); start(); }
  else if (isN(e.key)) { keys.n = true; if (e.key === ' ' || e.key === 'ArrowUp') e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (isL(e.key)) keys.l = false;
  if (isR(e.key)) keys.r = false;
  if (isN(e.key)) keys.n = false;
});
function touch(e) {
  const r = cv.getBoundingClientRect(), left = (e.clientX - r.left) < r.width / 2;
  keys.l = left; keys.r = !left;
}
cv.addEventListener('pointerdown', touch);
cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') touch(e); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { keys.l = keys.r = false; }));
nb.addEventListener('pointerdown', e => { e.preventDefault(); keys.n = true; nb.classList.add('on'); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => nb.addEventListener(t, () => { keys.n = false; nb.classList.remove('on'); }));
</script>
</body>
</html>
